name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DEMO_MODE: "true"
      RUN_HF_MODEL_TESTS: "1"
      HF_HOME: ${{ github.workspace }}/.hf-cache
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-${{ runner.os }}-sentence-transformers-all-MiniLM-L6-v2-v1

      - name: Install dependencies and lint tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff==0.11.13 pytest-timeout==2.4.0

      - name: Lint for errors and undefined names
        run: ruff check . --select E9,F63,F7,F82

      - name: Compile Python modules
        run: python -m compileall -q api agents database evaluation frontend llm mcp_clients mcp_servers rag scripts workflows

      - name: Check application imports
        run: python -m scripts.check_imports

      - name: Run automated tests
        run: python -m pytest -q --timeout=240 --timeout-method=thread
